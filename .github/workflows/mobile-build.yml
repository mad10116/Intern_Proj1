name: Mobile Build

on:
  push:
    branches:
      - main
      - master
      - feature/**

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rivweb12/riveriq-web/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Install dependencies
        working-directory: rivweb12/riveriq-web
        run: npm ci

      - name: Build web assets
        working-directory: rivweb12/riveriq-web
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: rivweb12/riveriq-web
        run: npx cap sync android

      - name: Fix gradlew permissions (Windows dev → Linux runner)
        working-directory: rivweb12/riveriq-web
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: rivweb12/riveriq-web/android
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: rivweb12/riveriq-web/android/app/build/outputs/apk/release/
          retention-days: 14

  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rivweb12/riveriq-web/package-lock.json

      - name: Install dependencies
        working-directory: rivweb12/riveriq-web
        run: npm ci

      - name: Build web assets
        working-directory: rivweb12/riveriq-web
        run: npm run build

      - name: Sync Capacitor iOS
        working-directory: rivweb12/riveriq-web
        run: npx cap sync ios

      - name: Build iOS (unsigned)
        working-directory: rivweb12/riveriq-web
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: rivweb12/riveriq-web/ios/build/Build/Products/Release-iphoneos/
          retention-days: 14
