name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        working-directory: rivweb12/riveriq-web
        run: npm ci

      - name: Build web
        working-directory: rivweb12/riveriq-web
        run: npm run build

      - name: Sync Capacitor
        working-directory: rivweb12/riveriq-web
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: rivweb12/riveriq-web/ios/App
        run: pod install

      # Unsigned archive — good for testing the build succeeds
      - name: Build (unsigned)
        working-directory: rivweb12/riveriq-web/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/RiverIQ.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Upload xcarchive
        uses: actions/upload-artifact@v4
        with:
          name: RiverIQ.xcarchive
          path: ${{ runner.temp }}/RiverIQ.xcarchive
          retention-days: 14

      # Signed IPA — requires secrets:
      #   IOS_CERTIFICATE_BASE64      Base64-encoded .p12 distribution certificate
      #   IOS_CERTIFICATE_PASSWORD    Certificate password
      #   IOS_PROVISION_BASE64        Base64-encoded .mobileprovision file
      #   IOS_EXPORT_OPTIONS_PLIST    Base64-encoded ExportOptions.plist
