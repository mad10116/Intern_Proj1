name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        working-directory: rivweb12/riveriq-web
        run: npm ci

      - name: Build web
        working-directory: rivweb12/riveriq-web
        run: npm run build

      - name: Sync Capacitor
        working-directory: rivweb12/riveriq-web
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: rivweb12/riveriq-web/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: rivweb12/riveriq-web/android
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: riveriq-debug.apk
          path: rivweb12/riveriq-web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # Signed release AAB — requires secrets configured in GitHub repo settings:
      #   KEYSTORE_BASE64       Base64-encoded .jks keystore file
      #   KEYSTORE_PASSWORD     Keystore password
      #   KEY_ALIAS             Key alias
      #   KEY_PASSWORD          Key password
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/riveriq.jks

      - name: Build release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: rivweb12/riveriq-web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=/tmp/riveriq.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload release AAB
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: riveriq-release.aab
          path: rivweb12/riveriq-web/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
